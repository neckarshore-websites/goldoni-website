name: Unit

# CI gate for the pure Node/tsx unit tests (Test Charter §4c — every existing
# suite must run in CI). These were green locally but invoked by no workflow.
# Fast, no browser, no secrets — kept in their own lightweight job.

on:
  push:
    branches: [main]
    # A stats.json-only commit (pushed by e2e.yml's emit-stats job) must not re-trigger
    # this workflow — nothing here depends on the emitted data file.
    paths-ignore:
      - 'stats.json'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Node unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          npm run test:lighthouse:unit
          npm run test:delivery:unit
          npm run test:schema:unit
          npm run test:qr:unit
          npm run test:search:unit
          npm run test:druck:unit
          npm run test:qr:print:unit
          npm run test:redirect:unit
          npm run test:bildherkunft:unit
          npm run test:hinweis:unit

      # NOT COVERED HERE, stated rather than left to be assumed: whether the printed QR
      # codes actually SCAN. That needs Apple's Vision decoder, which does not exist on
      # this runner, and jsQR cannot read the styled codes even when they are correct.
      # The gate is `npm run pruef:druck-qr` on macOS plus a real phone on a real proof,
      # before any print order. The three suites added above check that the artifacts
      # exist, that the SERVED copies equal the built ones, and that the printed address
      # matches the path this site serves — everything except the one thing a Linux
      # runner cannot honestly answer.
