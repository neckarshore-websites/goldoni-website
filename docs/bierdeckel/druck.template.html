<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Goldoni Bierdeckel — Druckdaten</title>
<style>
@font-face{font-family:"Playfair";src:url(data:font/woff2;base64,__FONT_PLAYFAIR__) format("woff2");font-weight:600;font-display:block}
@font-face{font-family:"Inter";src:url(data:font/woff2;base64,__FONT_INTER__) format("woff2");font-weight:400 700;font-display:block}

/* Datenformat der Vorlage: 280,63 x 246,614 pt = exakt 99 x 87 mm.
   GEMESSEN an der Vorlage-PDF der Druckerei, nicht aus dem Datenblatt
   abgetippt. (Meine erste Annahme war 100 x 87 — falsch um einen
   Millimeter in der Breite.) */
@page{size:280.63pt 246.614pt;margin:0}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;padding:0;background:#fff;font-family:"Inter",sans-serif}

.page{width:210mm;height:297mm;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14mm;page-break-after:always;overflow:hidden}
.page:last-child{page-break-after:auto}

.row{display:flex;gap:16mm;align-items:center}

/* Sechseck, ECHTE GROESSE.
   93 mm Spitze-zu-Spitze waagerecht. Ein regelmaessiges Sechseck ist damit
   93 * sqrt(3)/2 = 80,54 mm hoch — die 81 mm der Bestellung sind gerundet.
   Die Ecken der clip-path liegen bei 25 % und 75 %, weil die flache Kante
   oben genau eine Seitenlaenge misst (46,5 mm = 93/2). */
.mat{position:relative;width:93mm;height:80.54mm;overflow:hidden;
  container-type:inline-size;
  --mm:1.07527cqw;
  clip-path:polygon(0% 50%, 25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%);
  --espresso:#1A1612; --mozzarella:#FAFAFA; --parmigiano:#FEF1A5;
  --marinara:#8E2800; --olive:#746B03; --tan:#C9BD8A;
  display:flex;align-items:center;justify-content:center;text-align:center}

/* Sicherheitsflaeche. Alles Wichtige bleibt in diesem Rechteck: es passt
   vollstaendig in das Sechseck, auch wenn beim Stanzen 2 mm verrutschen. */
.safe{width:60%;display:flex;flex-direction:column;align-items:center;gap:calc(3*var(--mm))}

.front{background:var(--espresso)}
.back{background:var(--olive)}

.eyebrow{font-weight:600;font-size:calc(2.9*var(--mm));letter-spacing:.3em;
  text-transform:uppercase;margin:0}
.wordmark{font-family:"Playfair",Georgia,serif;font-weight:600;line-height:1;
  font-size:calc(15*var(--mm));margin:0;letter-spacing:-.01em}
.rule{width:calc(22*var(--mm));height:.35mm;border:0;margin:calc(1*var(--mm)) 0}
.meta{font-size:calc(3.1*var(--mm));line-height:1.5;margin:0}
/* Der Satz von der Startseite steht anstelle der Adresse (Betreiber-Wahl
   2026-08-25, volle Fassung). 86 Zeichen auf 93 mm: die Groesse ist deshalb
   nicht gestalterisch gewaehlt, sondern von der Zeichenzahl diktiert. Bleibt
   in der Grotesk, damit er der Playfair-Wortmarke die Buehne nicht streitig
   macht — bei dieser Laenge waere Serife ausserdem schwerer zu lesen.
   Der harte Umbruch nach "Westen." trennt die zwei Aussagen sauber, statt
   den Umbruch dem Zufall der Zeilenbreite zu ueberlassen. */
.claim{font-size:calc(2.95*var(--mm));line-height:1.5;letter-spacing:.005em;margin:0;
  text-wrap:balance}

.qr{width:calc(36*var(--mm));padding:calc(2.2*var(--mm));background:#fff;border-radius:.6mm}
.qr svg{display:block;width:100%;height:auto}
.cta{font-family:"Playfair",Georgia,serif;font-weight:600;line-height:1.06;
  font-size:calc(7.2*var(--mm));margin:0}
.sub{font-size:calc(3.1*var(--mm));line-height:1.45;margin:0}

/* Stanzkontur zur Kontrolle — liegt UEBER dem Motiv, druckt aber nur auf
   diesem Kontrollbogen mit. Die Druckdatei bekommt sie als eigene Ebene. */
.guide{position:absolute;inset:0;pointer-events:none}
.guide svg{width:100%;height:100%;display:block}

.label{font-size:3mm;letter-spacing:.18em;text-transform:uppercase;color:#8a8178;
  margin:0 0 3mm;text-align:center}
.note{font-size:3.2mm;line-height:1.5;color:#6b625a;max-width:150mm;text-align:center;margin:0}
.stack{display:flex;flex-direction:column;align-items:center}

/* DRUCKDATEN, nicht Kontrollbogen.

   KEIN clip-path. Der Kontrollbogen zeichnet das Sechseck, weil ein Mensch
   sehen soll, wie das Produkt aussieht. Die Druckdatei darf es NICHT
   zeichnen: der Hintergrund muss randlos ueber das volle Datenformat
   laufen, damit nach dem Stanzen keine weisse Kante stehen bleibt. Die
   Sechseckform macht das Werkzeug, nicht die Datei — "freie Stanzform"
   laut Datenblatt.

   SICHERHEITSABSTAND 6 mm, und zwar AB DATENFORMAT gemessen, nicht ab der
   Stanzkante — das steht so im Datenblatt und ist der Unterschied zur
   Postkarte, wo die 3 mm ab Endformat gelten. Nutzbar bleiben damit
   87 x 75 mm rechteckig. Der Inhalt liegt hier in 58 % der Breite und
   damit zusaetzlich innerhalb des Sechsecks, das an vier Ecken Flaeche
   verliert. */
html,body{width:280.63pt}
.sheet{width:280.63pt;height:246.614pt;page-break-after:always;overflow:hidden;
  display:flex;align-items:center;justify-content:center;text-align:center;
  container-type:inline-size;
  --mm:1.0101cqw;
  --espresso:#1A1612; --mozzarella:#FAFAFA; --parmigiano:#FEF1A5;
  --marinara:#8E2800; --olive:#746B03; --tan:#C9BD8A}
.sheet:last-child{page-break-after:auto}
.mat{position:static;width:100%;height:100%;clip-path:none;display:flex;
  align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="sheet front">
  <div class="mat front">
    <div class="safe">
      <p class="eyebrow" style="color:var(--tan)">Ristorante</p>
      <p class="wordmark" style="color:var(--mozzarella)">Goldoni</p>
      <hr class="rule" style="background:var(--tan)">
      <p class="claim" style="color:var(--tan)">Italienisch verliebte K&uuml;che im Stuttgarter Westen.<br>Frische Zutaten, mit Liebe gemacht.</p>
    </div>
  </div>
</div>

<div class="sheet back">
  <div class="mat back">
    <div class="safe">
      <p class="cta" style="color:var(--mozzarella)">Direkt bei<br>uns bestellen.</p>
      <div class="qr">__QR__</div>
      <p class="sub" style="color:var(--parmigiano)">Abholen oder liefern lassen.</p>
    </div>
  </div>
</div>

</body>
</html>
